<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>rotari short</title>
<style>
@font-face { font-family: Plex; src: url(__FONTS__/IBMPlexSans-Regular-Latin1.woff2); font-weight: 400; }
@font-face { font-family: Plex; src: url(__FONTS__/IBMPlexSans-Medium-Latin1.woff2); font-weight: 500; }
@font-face { font-family: Plex; src: url(__FONTS__/IBMPlexSans-SemiBold-Latin1.woff2); font-weight: 600; }
@font-face { font-family: PlexMono; src: url(__FONTS__/IBMPlexMono-Regular-Latin1.woff2); font-weight: 400; }
@font-face { font-family: PlexMono; src: url(__FONTS__/IBMPlexMono-Medium-Latin1.woff2); font-weight: 500; }
:root {
  --bg: #0b1118; --panel: #121a24; --line: #233041; --text: #e8edf3; --muted: #8a97a8;
  --red: #e5484d; --accent: #f08b70; --green: #4cc38a;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
  color: var(--text); font-family: Plex, sans-serif; }
body { background: radial-gradient(1200px 900px at 50% -10%, #1a2433 0%, var(--bg) 60%); }
#stage { position: absolute; inset: 0; }
.caption { position: absolute; left: 60px; right: 60px; top: 110px; height: 300px;
  display: flex; align-items: flex-end; font-size: 68px; font-weight: 600; line-height: 1.12;
  letter-spacing: -0.5px; }
.caption em { font-style: normal; color: var(--accent); }
.frame { position: absolute; left: 40px; right: 40px; background: var(--panel);
  border: 2px solid var(--line); border-radius: 28px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.bar { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 26px;
  border-bottom: 2px solid var(--line); color: var(--muted); font: 500 26px PlexMono, monospace; }
.dot { width: 18px; height: 18px; border-radius: 50%; background: #2c3a4d; flex: none; }
.bar .label { margin-left: 18px; white-space: nowrap; }
.tabs { display: flex; gap: 6px; margin-left: 14px; }
.tab { padding: 8px 16px; border-radius: 10px 10px 0 0; font-size: 24px; color: var(--muted); }
.tab.on { background: #1b2635; color: var(--text); }
.term { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; padding: 22px 26px;
  font: 400 30px/1.36 PlexMono, monospace; white-space: pre-wrap; word-break: break-all; overflow: hidden; }
.term.small { font-size: 26px; }
.term .p { color: var(--green); font-weight: 500; }
.term .c { display: inline-block; width: 0.6em; height: 1.15em; vertical-align: -0.2em; background: var(--text); }
.web { position: absolute; inset: 0; overflow: hidden; background: #0b1118; }
.web img { width: 100%; height: auto; display: block; }
.title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
  padding: 0 80px; gap: 10px; }
.title div { font-size: 128px; font-weight: 600; line-height: 1.04; letter-spacing: -3px; }
.title div.hl { color: var(--red); }
.title div.soft { color: var(--muted); }
.logo { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
  align-items: center; gap: 46px; }
.logo svg { width: 760px; height: auto; }
.logo .tag { font-size: 54px; font-weight: 500; color: var(--muted); text-align: center; line-height: 1.25; }
.logo .url { font: 500 40px PlexMono, monospace; color: var(--accent); }
.logo .install { font: 400 28px PlexMono, monospace; color: var(--text); background: var(--panel);
  border: 2px solid var(--line); border-radius: 16px; padding: 18px 26px; }
.cards { position: absolute; left: 40px; right: 40px; top: 470px; display: flex; flex-direction: column; gap: 34px; }
.card { background: #1d1416; border: 2px solid #5a2a2e; border-left: 10px solid var(--red);
  border-radius: 20px; padding: 26px 30px; }
.card .who { font: 500 26px PlexMono, monospace; color: var(--muted); margin-bottom: 10px; }
.card .what { font: 400 32px/1.35 PlexMono, monospace; color: #ffd9d6; word-break: break-word; }
.split-label { position: absolute; left: 70px; font: 600 30px Plex, sans-serif; color: var(--muted);
  letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="logo-src" hidden>__LOGO__</div>
<script>
const SCENES = __SCENES__;
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const logoSVG = document.getElementById("logo-src").innerHTML;

function termHTML(events, t) {
  let s = "";
  for (const [at, text] of events) {
    if (at > t) break;
    s = text === "\b" ? s.slice(0, -1) : s + text;
  }
  const typing = events.some(([at]) => at <= t && at > t - 0.15);
  const blink = typing || Math.floor(t * 2) % 2 === 0;
  return esc(s).replace(/\x01(.*?)\x02/g, '<span class="p">$1</span>') + (blink ? '<span class="c"></span>' : "");
}

function fadeIn(lt, delay = 0, dur = 0.35) {
  const k = ease((lt - delay) / dur);
  return `opacity:${k};transform:translateY(${(1 - k) * 30}px)`;
}

function caption(captions, lt) {
  let cur = null;
  for (const c of captions || []) if (c[0] <= lt) cur = c;
  return cur ? `<div class="caption"><div style="${fadeIn(lt, cur[0])}">${cur[1]}</div></div>` : "";
}

function termFrame(top, bottom, title, events, vt, small) {
  return `<div class="frame" style="top:${top}px;bottom:${bottom}px"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="label">${title}</span></div><div class="term${small ? " small" : ""}">${termHTML(events, vt)}</div></div>`;
}

function panY(pan, lt) {
  if (!pan || !pan.length) return 0;
  let y = pan[0][1];
  for (let i = 1; i < pan.length; i++) {
    const [t0, y0] = pan[i - 1], [t1, y1] = pan[i];
    if (lt >= t0) y = y0 + (y1 - y0) * ease((lt - t0) / Math.max(0.001, t1 - t0));
  }
  return y;
}

let pending = [];
async function render(t) {
  let s = SCENES[SCENES.length - 1];
  for (const x of SCENES) if (t >= x.start && t < x.start + x.dur) { s = x; break; }
  const lt = t - s.start;
  const vt = lt * (s.speed || 1);
  let html = "";
  if (s.kind === "title") {
    html = `<div class="title">` + s.lines.map(([text, cls, at]) =>
      `<div class="${cls || ""}" style="${fadeIn(lt, at || 0, 0.4)}">${text}</div>`).join("") + `</div>`;
  } else if (s.kind === "logo") {
    html = `<div class="logo"><div style="${fadeIn(lt, 0, 0.6)}">${logoSVG}</div>` +
      `<div class="tag" style="${fadeIn(lt, 0.6)}">${s.tagline}</div>` +
      (s.install ? `<div class="install" style="${fadeIn(lt, 1.0)}">${esc(s.install)}</div>` : "") +
      (s.url ? `<div class="url" style="${fadeIn(lt, 1.3)}">${s.url}</div>` : "") + `</div>`;
  } else if (s.kind === "term") {
    html = caption(s.captions, lt) + termFrame(450, 120, s.title, s.events, vt);
  } else if (s.kind === "tabs") {
    const per = s.dur / s.tabs.length;
    const i = Math.min(s.tabs.length - 1, Math.floor(lt / per));
    const tabs = s.tabs.map((tab, k) => `<span class="tab${k === i ? " on" : ""}">${tab.title}</span>`).join("");
    html = caption(s.captions, lt) +
      `<div class="frame" style="top:450px;bottom:120px"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="tabs">${tabs}</div></div>` +
      `<div class="term">${termHTML(s.tabs[i].events, (lt - i * per) * (s.speed || 1))}</div></div>`;
  } else if (s.kind === "split") {
    html = caption(s.captions, lt) +
      `<div class="split-label" style="top:440px">${s.top.label}</div>` + termFrame(490, 1010, s.top.title, s.top.events, vt, true) +
      `<div class="split-label" style="top:940px">${s.bottom.label}</div>` + termFrame(990, 90, s.bottom.title, s.bottom.events, vt, true);
  } else if (s.kind === "logs") {
    html = caption(s.captions, lt) + `<div class="cards">` + s.cards.map(([who, what], k) =>
      `<div class="card" style="${fadeIn(lt, 0.3 + k * 0.7)}"><div class="who">${esc(who)}</div><div class="what">${esc(what)}</div></div>`).join("") + `</div>`;
  } else if (s.kind === "web") {
    let f = s.frames[0];
    for (const x of s.frames) if (x[0] <= vt) f = x;
    html = caption(s.captions, lt) +
      `<div class="frame" style="top:450px;bottom:120px"><div class="web"><img src="${f[1]}" data-pan="${panY(s.pan, lt)}" data-css="${s.panCss ? s.cssWidth : 0}"></div></div>`;
  }
  document.getElementById("stage").innerHTML = html;
  document.getElementById("stage").style.opacity = ease(lt / 0.25) * (1 - ease((lt - s.dur + 0.15) / 0.15));
  const img = document.querySelector(".web img");
  if (img) {
    await img.decode();
    const box = img.parentElement;
    const overflow = Math.max(0, img.offsetHeight - box.clientHeight);
    // pan is a fraction of the overflow, or with panCss a page position in CSS px.
    const css = Number(img.dataset.css);
    const y = css ? Number(img.dataset.pan) * (img.offsetWidth / css) : Number(img.dataset.pan) * overflow;
    img.style.transform = `translateY(${-Math.max(0, Math.min(overflow, y))}px)`;
  }
}
</script>
</body>
</html>
