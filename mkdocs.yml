site_name: rotari documentation
site_description: Documentation for rotari, an execution manager for experiment batches
site_url: https://kamo-naoyuki.github.io/rotari/docs/
repo_url: https://github.com/kamo-naoyuki/rotari
repo_name: kamo-naoyuki/rotari

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - User guide:
      - Getting started: GETTING_STARTED.md
      - CLI reference: CLI_REFERENCE.md
      - Concepts: CONCEPTS.md
      - Executors and schedulers: EXECUTORS.md
      - Running and recovering: RUNNING.md
      - Inspecting and diagnosing: INSPECT.md
      - Configuration: CONFIGURATION.md
      - Environment variables: ENVIRONMENT_VARIABLES.md
      - Operations: OPERATIONS.md
      - Workflow manifests: WORKFLOW_MANIFESTS.md
      - Comparison with other tools: TOOL_COMPARISON.md
      - Docker: DOCKER.md
      - Examples: examples.md
      - FAQ: FAQ.md
  - Integrations:
      - Notifications: NOTIFICATIONS.md
      - LLM diagnosis: LLM_DIAGNOSIS.md
      - Local diagnosis rules: LOCAL_DIAGNOSIS.md
  - Development:
      - Architecture: ARCHITECTURE.md
  - API reference:
      - Python client: PYTHON_CLIENT.md
      - Python API: python-api.md
      - Go API: go-api.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - "."
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            members_order: source
            show_signature_annotations: true
            show_root_heading: true
            show_source: false

hooks:
  - scripts/mkdocs_llms.py

validation:
  links:
    not_found: ignore

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
