[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotari"
version = "0.1.0"
description = "Python client for the rotari command-line interface"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
docs = ["Sphinx>=7"]

[project.scripts]
rotari = "rotari._cli:main"

[tool.setuptools]
packages = ["rotari"]

[tool.setuptools.package-data]
rotari = ["_bin/rotari"]
