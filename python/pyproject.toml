[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rotari"
dynamic = ["version"]
description = "Python client for the rotari command-line interface"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.27"]

[project.scripts]
rotari = "rotari._cli:main"

[tool.setuptools_scm]
# python/ is a subdirectory of the repository; the git root is one level up.
root = ".."

[tool.setuptools]
packages = ["rotari"]

[tool.setuptools.package-data]
rotari = ["_bin/rotari"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/test_*.py" = ["PT"]
"python/tests/test_client.py" = ["SIM117"]
