default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black]
        files: ^python/

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^python/

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: gofmt-check
        name: gofmt check
        entry: bash -c 'test -z "$(gofmt -l $(git ls-files "*.go"))"'
        language: system
        pass_filenames: false

      - id: prettier-check
        name: prettier check
        entry: npm run format:check
        language: system
        pass_filenames: false
        files: ^cmd/rotari/assets/web_(template\.html|app_.*\.js|styles\.css)$

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        stages: [manual]

      - id: example-shellcheck
        name: bash syntax check
        entry: bash -n
        language: system
        files: ^example\.sh$
