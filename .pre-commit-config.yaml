default_language_version:
  python: python3

ci:
  autofix_prs: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^conda/recipe/meta\.yaml$
      - id: check-added-large-files

  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: [--profile=black]
        files: ^python/

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        files: ^python/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        language_version: "22.23.2"
        files: ^cmd/rotari/assets/.*\.(html|js|css)$

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: gofmt-check
        name: gofmt check
        entry: bash -c 'test -z "$(gofmt -l $(git ls-files "*.go"))"'
        language: system
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        stages: [manual]

      - id: example-shellcheck
        name: bash syntax check
        entry: bash -n
        language: system
        files: ^example\.sh$
