default_language_version:
  python: python3

ci:
  autofix_prs: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # MkDocs uses a PyYAML !!python/name tag for custom Mermaid fences.
        exclude: ^mkdocs\.yml$
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--config, python/pyproject.toml, --fix]
        files: ^(python|scripts)/
      - id: ruff-format
        args: [--config, python/pyproject.toml]
        files: ^(python|scripts)/

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, "4"]
        files: ^(scripts|examples)/.*\.sh$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        language_version: "22.23.2"
        files: ^internal/webui/assets/.*\.(html|js|css)$

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        # Bootstraps Go in pre-commit.ci instead of relying on a system gofmt.
        language: golang
        language_version: 1.23.12
        types: [go]

      - id: example-shellcheck
        name: bash syntax check
        # pre-commit passes every matching file at once, and "bash -n a b"
        # checks only "a", so check each file separately.
        entry: sh -c 'for file in "$@"; do bash -n "$file" || exit 1; done' --
        language: system
        files: ^examples/.*\.sh$
