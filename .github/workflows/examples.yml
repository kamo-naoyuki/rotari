name: Example integration

"on":
  push:
    paths:
      - "**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build rotari
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/rotari" ./cmd/rotari

      - name: Check example scripts
        run: find examples -name '*.sh' -exec bash -n {} \;

      - name: Run local examples
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP:$PATH"
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          run_example() {
            local script="$1" expected="$2" run_dir="$workdir/${1%.sh}" output="$workdir/${1%.sh}.log"
            shift 2
            mkdir -p "$run_dir"
            (cd "$run_dir" && ROTARI_MASTERDIR="$run_dir/master" bash "$GITHUB_WORKSPACE/examples/$script") | tee "$output"
            grep -Fq -- "$expected" "$output" || {
              echo "$script did not produce expected output: $expected" >&2
              return 1
            }
            local artifact
            for artifact in "$@"; do
              [[ -s "$run_dir/.example-state/$artifact" ]] || {
                echo "$script did not produce non-empty artifact: $artifact" >&2
                return 1
              }
            done
          }

          run_example basic.sh "Success: 2"
          run_example array.sh "Success: 3"
          run_example matrix.sh "Success: 4"
          run_example retry.sh "Success: 1"
          run_example async.sh "Success: 1"
          run_example workflow.sh "Exported workflow:" exported.yaml
          run_example workflow-reconcile.sh "Example state:" exported.yaml reconciled.yaml
          run_example diagnose-rules.sh "Python import or module missing"

      - name: Run Slurm example in a container
        shell: bash
        run: |
          set -euo pipefail
          container="rotari-slurm-example-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="rotari-slurm-example-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null

          docker run --detach --name "$container" --hostname slurmctl \
            --interactive --tty \
            --cap-add SYS_ADMIN \
            --volume "$GITHUB_WORKSPACE/examples:/workspace/examples:ro" \
            --volume "$RUNNER_TEMP/rotari:/usr/local/bin/rotari:ro" \
            --volume "$volume:/state" \
            giovtorres/docker-centos7-slurm:latest

          ready=0
          for attempt in {1..60}; do
            if docker exec "$container" sinfo >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" == 0 ]]; then
            docker logs "$container"
            exit 1
          fi

          docker exec --user root "$container" chown -R slurm:slurm /state
          if output=$(docker exec --user slurm --workdir /state --env HOME=/home/slurm \
            --env ROTARI_MASTERDIR=/state/master "$container" \
            bash /workspace/examples/slurm.sh 2>&1); then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
          grep -Fq -- "Success: 2" <<< "$output"
