name: Example scripts

on:
  push:
    paths:
      - "scripts/example.sh"
      - "scripts/example-workflow.sh"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "scripts/example.sh"
      - "scripts/example-workflow.sh"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check example scripts
        run: |
          bash -n scripts/example.sh
          bash -n scripts/example-workflow.sh
