name: Python

on:
  push:
    paths:
      - "python/**"
      - "cmd/rotari/**"
      - "scripts/**"
      - ".github/workflows/python.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "python/**"
      - "cmd/rotari/**"
      - "scripts/**"
      - ".github/workflows/python.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install pytest ruff==0.16.9 ./python

      - name: Lint Python code
        run: ruff check python scripts

      - name: Check Python formatting
        run: ruff format --check python scripts

      - name: Run Python tests
        run: PYTHONPATH=python python -m pytest python/tests

      - name: Check generated Python CLI metadata
        run: |
          tmpdir=$(mktemp -d)
          go run ./cmd/rotari schema --json > "$tmpdir/schema.json"
          python3 scripts/generate_python_cli.py \
            --input "$tmpdir/schema.json" \
            --output "$tmpdir/generated_cli.py"
          ruff check --config python/pyproject.toml --fix "$tmpdir/generated_cli.py"
          ruff format "$tmpdir/generated_cli.py"
          diff -u python/rotari/generated_cli.py "$tmpdir/generated_cli.py"
