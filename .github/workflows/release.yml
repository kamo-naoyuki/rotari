name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            wheel_plat: linux_x86_64
          - goos: linux
            goarch: arm64
            wheel_plat: linux_aarch64
          - goos: darwin
            goarch: amd64
            wheel_plat: macosx_10_12_x86_64
          - goos: darwin
            goarch: arm64
            wheel_plat: macosx_11_0_arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Check web asset formatting
        run: npm run format:check

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Test
        run: gotestsum --format pkgname-and-test-fails -- ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "rotari-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/rotari

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rotari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rotari-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set package version from tag
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" python/pyproject.toml

      - name: Bundle rotari executable into Python package
        run: |
          mkdir -p python/rotari/_bin
          cp "rotari-${{ matrix.goos }}-${{ matrix.goarch }}" python/rotari/_bin/rotari
          chmod +x python/rotari/_bin/rotari

      - name: Build platform-specific wheel
        working-directory: python
        run: |
          python -m pip install --upgrade setuptools wheel
          python setup.py bdist_wheel --python-tag py3 --plat-name "${{ matrix.wheel_plat }}" --dist-dir ../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: rotari-wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.whl

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rotari-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

  update-homebrew-formula:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: kamo-naoyuki/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          url="https://github.com/${REPOSITORY}/archive/refs/tags/${VERSION}.tar.gz"
          sha256="$(curl --fail --location --retry 3 --silent --show-error "$url" | sha256sum | awk '{print $1}')"
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha256\"|" \
            Formula/rotari.rb
          git diff --check
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rotari.rb
          git commit -m "rotari ${VERSION}"
          git push
