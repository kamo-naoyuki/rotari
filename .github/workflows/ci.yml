name: Go CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install shell completion test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Run vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run tests
        run: gotestsum --format pkgname-and-test-fails -- -coverprofile=coverage.out ./...

      - name: Run race detector
        run: gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: go build -o "$RUNNER_TEMP/rotari" ./cmd/rotari

      - name: Check example scripts
        run: find examples -name '*.sh' -exec bash -n {} \;

      - name: Run local examples
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP:$PATH"
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          run_example() {
            local script="$1" expected="$2" run_dir="$workdir/${1%.sh}" output="$workdir/${1%.sh}.log"
            shift 2
            mkdir -p "$run_dir"
            (cd "$run_dir" && ROTARI_MASTERDIR="$run_dir/master" bash "$GITHUB_WORKSPACE/examples/$script") | tee "$output"
            grep -Fq -- "$expected" "$output" || {
              echo "$script did not produce expected output: $expected" >&2
              return 1
            }
            local artifact
            for artifact in "$@"; do
              [[ -s "$run_dir/.example-state/$artifact" ]] || {
                echo "$script did not produce non-empty artifact: $artifact" >&2
                return 1
              }
            done
          }

          run_example basic.sh "Success: 2"
          run_example array.sh "Success: 3"
          run_example matrix.sh "Success: 4"
          run_example retry.sh "Success: 1"
          run_example async.sh "Success: 1"
          run_example workflow.sh "Exported workflow:" exported.yaml
          run_example workflow-reconcile.sh "Example state:" exported.yaml reconciled.yaml
          run_example diagnose-rules.sh "Python import or module missing"
