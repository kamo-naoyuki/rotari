name: Go CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python formatting tools
        run: python -m pip install black==25.1.0 isort==6.0.1

      - name: Install shell completion test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Check web asset formatting
        run: npm run format:check

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run tests
        run: gotestsum --format pkgname-and-test-fails -- -coverprofile=coverage.out ./...

      - name: Run race detector
        run: gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: go build ./cmd/rotari

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate Go API documentation
        run: >-
          python3 scripts/generate_go_docs.py
          --output-dir "${{ runner.temp }}/go-api"
          --dependency-graph

      - name: Upload Go API documentation
        uses: actions/upload-artifact@v4
        with:
          name: go-api
          path: ${{ runner.temp }}/go-api

      - name: Check example scripts
        run: |
          bash -n scripts/example.sh
          bash -n scripts/example-workflow.sh

      - name: Check generated Python CLI metadata
        run: |
          tmpdir=$(mktemp -d)
          go run ./cmd/rotari schema --json > "$tmpdir/schema.json"
          python3 scripts/generate_python_cli.py \
            --input "$tmpdir/schema.json" \
            --output "$tmpdir/generated_cli.py"
          python -m isort --profile black "$tmpdir/generated_cli.py"
          python -m black "$tmpdir/generated_cli.py"
          diff -u python/rotari/generated_cli.py "$tmpdir/generated_cli.py"

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install pytest "./python[docs]"

      - name: Run tests
        run: PYTHONPATH=python python -m pytest python/tests

      - name: Build Python API documentation
        run: python -m sphinx -W -b html python/docs python/docs/_build/html
