name: Go CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install shell completion test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Run vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run tests
        run: gotestsum --format pkgname-and-test-fails -- -coverprofile=coverage.out ./...

      - name: Run race detector
        run: gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: go build ./cmd/rotari

      - name: Check example scripts
        run: |
          bash -n scripts/example.sh
          bash -n scripts/example-workflow.sh
