name: Go CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install shell completion test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Run vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run tests
        run: gotestsum --format pkgname-and-test-fails -- -coverprofile=coverage.out ./...

      - name: Run race detector
        run: gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: go build ./cmd/rotari

  ssh-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Start loopback SSH server
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/rotari-ssh-integration"
          mkdir -m 700 "$test_dir"
          echo "SSH_TEST_DIR=$test_dir" >> "$GITHUB_ENV"
          ssh-keygen -q -t ed25519 -N '' -f "$test_dir/client_key"
          ssh-keygen -q -t ed25519 -N '' -f "$test_dir/host_key"
          cp "$test_dir/client_key.pub" "$test_dir/authorized_keys"
          chmod 600 "$test_dir/authorized_keys"
          port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          printf '[127.0.0.1]:%s %s\n' "$port" "$(cat "$test_dir/host_key.pub")" > "$test_dir/known_hosts"
          cat > "$test_dir/sshd_config" <<EOF
          Port $port
          ListenAddress 127.0.0.1
          HostKey $test_dir/host_key
          PidFile $test_dir/sshd.pid
          AuthorizedKeysFile $test_dir/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          UsePAM yes
          AllowUsers $(id -un)
          EOF
          cat > "$test_dir/client_config" <<EOF
          Host rotari-ssh-test
            HostName 127.0.0.1
            Port $port
            User $(id -un)
            IdentityFile $test_dir/client_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $test_dir/known_hosts
            GlobalKnownHostsFile /dev/null
            ConnectTimeout 5
          EOF
          chmod 600 "$test_dir/client_config"
          sudo install -d -m 755 /run/sshd
          sudo /usr/sbin/sshd -t -f "$test_dir/sshd_config"
          sudo /usr/sbin/sshd -f "$test_dir/sshd_config" -E "$test_dir/sshd.log"
          ssh -F "$test_dir/client_config" rotari-ssh-test true
          echo "ROTARI_SSH_INTEGRATION_CONFIG=$test_dir/client_config" >> "$GITHUB_ENV"

      - name: Run real SSH integration tests
        run: go test ./internal/executor -run '^TestSSHIntegration' -count=1 -v

      - name: Show SSH server log on failure
        if: failure()
        run: if [[ -f "$SSH_TEST_DIR/sshd.log" ]]; then sudo cat "$SSH_TEST_DIR/sshd.log"; fi

      - name: Stop SSH server
        if: always()
        run: if [[ -f "$SSH_TEST_DIR/sshd.pid" ]]; then sudo kill "$(cat "$SSH_TEST_DIR/sshd.pid")"; fi

  example-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check example scripts
        run: |
          bash -n scripts/example.sh
          bash -n scripts/example-workflow.sh

  python-cli-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python formatting tools
        run: python -m pip install ruff==0.14.10

      - name: Check generated Python CLI metadata
        run: |
          tmpdir=$(mktemp -d)
          go run ./cmd/rotari schema --json > "$tmpdir/schema.json"
          python3 scripts/generate_python_cli.py \
            --input "$tmpdir/schema.json" \
            --output "$tmpdir/generated_cli.py"
          ruff check --select I --fix "$tmpdir/generated_cli.py"
          ruff format "$tmpdir/generated_cli.py"
          diff -u python/rotari/generated_cli.py "$tmpdir/generated_cli.py"

  go-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate Go API documentation
        run: >-
          python3 scripts/generate_go_docs.py
          --output-dir "${{ runner.temp }}/go-api"
          --dependency-graph

      - name: Upload Go API documentation
        uses: actions/upload-artifact@v4
        with:
          name: go-api
          path: ${{ runner.temp }}/go-api

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag rotari:ci --build-arg VERSION=ci .

      - name: Smoke test container image
        run: test "$(docker run --rm rotari:ci version)" = "rotari ci"

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install pytest "./python[docs]"

      - name: Run tests
        run: PYTHONPATH=python python -m pytest python/tests

      - name: Build documentation
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/mkdocs-site"
