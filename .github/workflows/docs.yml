name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "python/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation dependencies
        run: python -m pip install "./python[docs]"

      - name: Build documentation
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/mkdocs-site"
