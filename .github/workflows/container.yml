name: Container

on:
  push:
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag rotari:ci --build-arg VERSION=ci .

      - name: Smoke test container image
        run: test "$(docker run --rm rotari:ci version)" = "rotari ci"
