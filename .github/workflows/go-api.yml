name: Go API documentation

on:
  push:
    paths:
      - "cmd/**/*.go"
      - "internal/**/*.go"
      - "scripts/generate_go_docs.py"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-api.yml"
  pull_request:
    paths:
      - "cmd/**/*.go"
      - "internal/**/*.go"
      - "scripts/generate_go_docs.py"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate Go API documentation
        run: >-
          python3 scripts/generate_go_docs.py
          --output-dir "${{ runner.temp }}/go-api"
          --dependency-graph

      - name: Upload Go API documentation
        uses: actions/upload-artifact@v4
        with:
          name: go-api
          path: ${{ runner.temp }}/go-api
