name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate static web demo
        run: |
          GO_BINARY="$(command -v go)" scripts/generate-static-web.sh

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Go API documentation
        run: |
          python3 scripts/generate_go_docs.py \
            --output-dir "$RUNNER_TEMP/go-api" \
            --dependency-graph

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install terminal demo tools
        run: |
          python -m pip install asciinema "./python[docs]"
          cargo install --locked --git https://github.com/asciinema/agg

      - name: Generate terminal demos
        run: |
          scripts/generate-demos.sh
          cp docs/demo-shell.gif docs/demo-rotari.gif docs/web-demo/

      - name: Build Python API documentation
        run: |
          python -m sphinx -W -b html python/docs "$RUNNER_TEMP/python-api"

      - name: Generate PyPI-style package index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate_pypi_index.py \
            --repo "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/pypi-index"

      - name: Assemble Pages site
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp -a docs/web-demo/. "$RUNNER_TEMP/pages-site/"
          cp -a "$RUNNER_TEMP/go-api" "$RUNNER_TEMP/pages-site/go-api"
          cp -a "$RUNNER_TEMP/python-api" "$RUNNER_TEMP/pages-site/python-api"
          cp -a "$RUNNER_TEMP/pypi-index/simple" "$RUNNER_TEMP/pages-site/simple"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
