name: Scheduler integration

on:
  push:
    paths:
      - "**"
      - ".github/workflows/scheduler-integration.yml"
  workflow_dispatch:
    inputs:
      executor:
        description: Scheduler executor to test
        required: true
        type: choice
        options:
          - slurm
          - pbs
          - sge

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.executor }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        executor: ${{ fromJSON(inputs.executor && format('["{0}"]', inputs.executor) || '["slurm", "pbs"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run unit tests
        run: gotestsum --format pkgname-and-test-fails -- ./...

      - name: Run scheduler container integration tests
        env:
          EXECUTOR: ${{ matrix.executor }}
          SCHEDULER_TEST_RUNNER: gotestsum
          GOTESTSUM_FORMAT: pkgname-and-test-fails
        run: scripts/scheduler-integration.sh "$EXECUTOR"
