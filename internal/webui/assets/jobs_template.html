<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rotari Job activity</title>
    __ROTARI_FAVICON_LINKS__
    <style>
      __ROTARI_INFO_STYLES__
    </style>
  </head>
  <body>
    <main class="jobs-main">
      <nav class="sidebar" aria-label="Primary navigation">
        <a
          class="sidebar-brand"
          href="__ROTARI_HOME_PATH__"
          aria-label="rotari home"
        >
          <span class="brand-mark" aria-hidden="true"
            >__ROTARI_BRAND_ICON__</span
          >
          <span class="brand-name">rotari</span>
          <span class="brand-caption">JOB CONTROL</span>
        </a>
        <div class="sidebar-section-heading">Registered basedirs</div>
        <div class="sidebar-section-note">
          State directories known to rotari
        </div>
        __ROTARI_JOBS_PROJECTS__
      </nav>
      <div
        class="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <div class="content">
        <header>
          <div>
            <h1>__ROTARI_BRAND_ICON__rotari Job activity</h1>
            <div class="meta">
              Running jobs and jobs finished in the last 24 hours
            </div>
          </div>
          __ROTARI_JOBS_TOOLBAR__
        </header>
        __ROTARI_CONTENT__
      </div>
    </main>
    <script>
      const jobsSidebar = document.querySelector(".sidebar");
      const jobsSidebarScrollKey =
        "rotari-sidebar-scroll:" + "__ROTARI_BASEDIR_SCROLL_KEY__";
      const jobsSidebarSavedScroll = Number(
        sessionStorage.getItem(jobsSidebarScrollKey),
      );
      if (Number.isFinite(jobsSidebarSavedScroll))
        jobsSidebar.scrollTop = jobsSidebarSavedScroll;
      jobsSidebar.addEventListener(
        "scroll",
        () =>
          sessionStorage.setItem(
            jobsSidebarScrollKey,
            String(jobsSidebar.scrollTop),
          ),
        { passive: true },
      );
      const jobsResizeHandle = document.querySelector(".sidebar-resizer");
      function applyJobsSidebarWidth() {
        if (window.innerWidth <= 760) {
          jobsSidebar.style.width = "";
          return;
        }
        const jobsSavedWidth = Number(
          localStorage.getItem("rotari-sidebar-width"),
        );
        if (Number.isFinite(jobsSavedWidth) && jobsSavedWidth > 0)
          jobsSidebar.style.width =
            Math.max(190, Math.min(520, jobsSavedWidth)) + "px";
      }
      applyJobsSidebarWidth();
      window.addEventListener("resize", applyJobsSidebarWidth);
      function fitJobsBasedirPaths() {
        jobsSidebar
          .querySelectorAll(".basedir-path[data-full-path]")
          .forEach((link) => {
            const path = link.dataset.fullPath;
            link.textContent = path;
            if (link.scrollWidth <= link.clientWidth) return;
            let low = 0;
            let high = path.length;
            let best = "…";
            while (low <= high) {
              const kept = Math.floor((low + high) / 2);
              const start = Math.ceil(kept / 2);
              const end = Math.floor(kept / 2);
              const candidate =
                path.slice(0, start) + "…" + (end ? path.slice(-end) : "");
              link.textContent = candidate;
              if (link.scrollWidth <= link.clientWidth) {
                best = candidate;
                low = kept + 1;
              } else {
                high = kept - 1;
              }
            }
            link.textContent = best;
          });
      }
      new ResizeObserver(fitJobsBasedirPaths).observe(jobsSidebar);
      jobsResizeHandle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const startX = event.clientX;
        const startWidth = jobsSidebar.getBoundingClientRect().width;
        jobsResizeHandle.classList.add("dragging");
        const move = (moveEvent) => {
          const width = Math.max(
            190,
            Math.min(520, startWidth + moveEvent.clientX - startX),
          );
          jobsSidebar.style.width = width + "px";
          localStorage.setItem("rotari-sidebar-width", String(width));
          fitJobsBasedirPaths();
        };
        const end = () => {
          jobsResizeHandle.classList.remove("dragging");
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", end);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", end);
      });
      jobsResizeHandle.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const width = Math.max(
          190,
          Math.min(
            520,
            jobsSidebar.getBoundingClientRect().width + direction * 12,
          ),
        );
        jobsSidebar.style.width = width + "px";
        localStorage.setItem("rotari-sidebar-width", String(width));
        fitJobsBasedirPaths();
      });
      fitJobsBasedirPaths();

      function copyJobsValueFallback(value) {
        const input = document.createElement("textarea");
        input.value = value;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.append(input);
        input.select();
        const copied = document.execCommand("copy");
        input.remove();
        if (!copied) throw new Error("Copy failed");
      }

      async function copyJobsValue(button) {
        const value = button.dataset.copyValue;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(value);
            } catch (error) {
              copyJobsValueFallback(value);
            }
          } else {
            copyJobsValueFallback(value);
          }
        } catch (error) {
          alert(error.message);
          return;
        }
        // Show the same check-mark feedback as the main Web UI, then
        // restore the button.
        const title = button.dataset.copyTitle || button.title;
        button.dataset.copyTitle = title;
        button.classList.add("copied");
        button.title = "Copied!";
        button.setAttribute("aria-label", "Copied!");
        button.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';
        clearTimeout(button.copyResetTimer);
        button.copyResetTimer = setTimeout(() => {
          button.classList.remove("copied");
          button.title = title;
          button.setAttribute("aria-label", title);
          button.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="11" height="11" rx="1"></rect><rect x="9" y="4" width="11" height="11" rx="1"></rect></svg>';
        }, 1200);
      }

      function toggleJobsSidebar(button) {
        const root = button.closest(".sidebar-project");
        const projects = root.querySelector(".sidebar-projects");
        const expanded = root.classList.toggle("expanded");
        button.setAttribute("aria-expanded", String(expanded));
        projects.hidden = !expanded;
      }

      function sortJobsTable(table, key, direction) {
        const headers = [...table.querySelectorAll("thead th")];
        const index = headers.findIndex(
          (header) => header.dataset.sort === key,
        );
        if (index < 0) return;
        const rows = [...table.querySelectorAll("tbody tr")];
        rows.sort((left, right) => {
          const a =
            left.children[index].dataset.sortValue ||
            left.children[index].textContent.trim();
          const b =
            right.children[index].dataset.sortValue ||
            right.children[index].textContent.trim();
          return a.localeCompare(b, undefined, { numeric: true }) * direction;
        });
        rows.forEach((row) => table.querySelector("tbody").append(row));
        headers.forEach((header) => {
          header.textContent =
            header.dataset.label +
            (header.dataset.sort !== key
              ? " ↕"
              : direction === 1
                ? " ↑"
                : " ↓");
        });
      }

      document
        .querySelectorAll(".jobs-table th[data-sort]")
        .forEach((header) => {
          header.dataset.label = header.textContent.trim();
          header.textContent = header.dataset.label + " ↕";
          header.title = "Sort by " + header.dataset.label;
          header.addEventListener("click", () => {
            const direction = header.dataset.direction === "1" ? -1 : 1;
            header.dataset.direction = String(direction);
            sortJobsTable(
              header.closest("table"),
              header.dataset.sort,
              direction,
            );
          });
        });

      const jobsNotificationsDefaultOn = __ROTARI_NOTIFICATION_DEFAULT__;
      const jobsNotificationIcon = "__ROTARI_NOTIFICATION_ICON__";
      const jobsNotificationsEnabledKey = "rotari-notifications-enabled";
      function jobsNotificationsEnabled() {
        const stored = localStorage.getItem(jobsNotificationsEnabledKey);
        return stored === null
          ? jobsNotificationsDefaultOn
          : stored !== "false";
      }

      function updateJobsNotifyToggleLabel() {
        const button = document.getElementById("notify-toggle");
        if (!button) return;
        if (typeof Notification === "undefined") {
          button.hidden = true;
          return;
        }
        button.disabled = Notification.permission === "denied";
        button.textContent =
          Notification.permission === "granted" && jobsNotificationsEnabled()
            ? "Notification on"
            : "Notification off";
      }

      async function toggleJobsNotifications() {
        if (typeof Notification === "undefined") return;
        if (Notification.permission === "default") {
          await Notification.requestPermission();
        } else if (Notification.permission === "granted") {
          localStorage.setItem(
            jobsNotificationsEnabledKey,
            jobsNotificationsEnabled() ? "false" : "true",
          );
        }
        updateJobsNotifyToggleLabel();
      }

      function jobsNotificationSnapshot(documentNode) {
        const rows = new Map();
        documentNode
          .querySelectorAll("tr[data-notification-key]")
          .forEach((row) => {
            rows.set(row.dataset.notificationKey, {
              state: row.querySelector(".jobs-state").textContent.trim(),
              project: row.dataset.project,
              job: row.dataset.job,
              runURL: row.dataset.runUrl,
            });
          });
        return rows;
      }

      function notifyJobsActivity(job) {
        if (
          typeof Notification === "undefined" ||
          Notification.permission !== "granted" ||
          !jobsNotificationsEnabled()
        )
          return;
        const failed = job.state === "failed";
        const notification = new Notification(
          failed ? "rotari: job failed" : "rotari: job finished",
          {
            body: job.project + " / " + job.job,
            icon: jobsNotificationIcon,
          },
        );
        notification.onclick = () => {
          window.focus();
          location.href = job.runURL;
        };
      }

      let previousJobsActivity = jobsNotificationSnapshot(document);
      async function pollJobsActivity() {
        try {
          const response = await fetch(location.href, { cache: "no-store" });
          if (!response.ok) return;
          const html = await response.text();
          const nextDocument = new DOMParser().parseFromString(
            html,
            "text/html",
          );
          const nextJobs = jobsNotificationSnapshot(nextDocument);
          nextJobs.forEach((job, key) => {
            const previous = previousJobsActivity.get(key);
            if (
              (job.state === "failed" || job.state === "success") &&
              (!previous || previous.state === "running")
            )
              notifyJobsActivity(job);
          });
          previousJobsActivity = nextJobs;
        } catch (error) {
          // Keep polling after temporary network or parsing failures.
        }
      }

      updateJobsNotifyToggleLabel();
      setInterval(pollJobsActivity, 2000);
    </script>
  </body>
</html>
